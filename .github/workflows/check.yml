name: Verificación
on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aip_test
          POSTGRES_PASSWORD: integration_only
          POSTGRES_DB: aip_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aip_test -d aip_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://aip_test:integration_only@127.0.0.1:5432/aip_integration?sslmode=disable
      - run: npm run build
      - run: npm audit --audit-level=high
